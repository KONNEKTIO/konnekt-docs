name: Check Markdown links

on:
  pull_request:
  schedule:
    # Monday 06:00 UTC - full sweep, catches GitBook edits pushed straight to main
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        config-file: '.github/workflows/mcl_config.json'
        use-verbose-mode: 'yes'
        # On a pull request, check only the files that PR touches, so
        # pre-existing broken links elsewhere cannot mask a new regression.
        # Ignored by the scheduled run, which sweeps the whole repository.
        check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
        base-branch: 'main'
